[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mlsecops-pipeline"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "openai",
    "python-dotenv",
    "httpx",
    "pandas",
    "pyarrow",
]

[project.optional-dependencies]
dev = ["pytest", "jupyter", "ipykernel"]

[tool.setuptools.packages.find]
where = ["."]
include = ["parsers*", "models*", "services*", "llm*", "boart*", "cli*", "logging_utils*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
